# PDF 互動講義批改系統，Cloudflare Workers 設定。
# 部署：npx wrangler d1 migrations apply pdf-workbook-db --remote 之後 npx wrangler deploy。
# 綁定：DB 為 D1 資料庫，FILES 為 R2 儲存桶（PDF、照片與大型 JSON）。

name = "pdf-workbook-api"
main = "worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# 預留說明：本專案學生在台灣，邊節點命中即可；D1 位置不需 location hint。

[[d1_databases]]
binding = "DB"
database_name = "pdf-workbook-db"
database_id = "f0a48761-e64c-4dee-aa07-1352778d8a98"

[[r2_buckets]]
binding = "FILES"
bucket_name = "pdf-workbook-files"

[observability]
enabled = true
